name: Angular CI

on:
   pull_request:
    branches:
      - main
      - release/dev
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name : checkout code
        uses: actions/checkout@v3
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
